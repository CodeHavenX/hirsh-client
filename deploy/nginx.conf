server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/wasm application/json text/css;

    # The backend's own multipart limit is 55MB (hirsh application.yaml).
    client_max_body_size 55m;

    # Same origin as the page, so the SameSite=Lax session cookie is first-party.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html names the hashed .wasm files, so it must never be served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
