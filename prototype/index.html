<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HISS — Iniciar sesion</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>

<div class="auth-center">
  <div class="auth-box">
    <div class="auth-logo">H</div>
    <div class="auth-title">HISS</div>
    <div class="auth-sub">Hospital Information System</div>

    <div class="field">
      <label>Usuario</label>
      <input type="text" placeholder="nombre de usuario" id="login-user" value="drpatel">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" placeholder="••••••••" id="login-pass" value="password">
    </div>

    <div id="login-error" class="hidden" style="font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;background:var(--warn-wash)">
      Usuario o contraseña incorrectos
    </div>

    <button class="btn btn-primary btn-wide" onclick="doLogin()">Iniciar sesion</button>
    <div class="auth-foot">Las sesiones expiran despues de 8h de inactividad</div>
  </div>
</div>

<script src="shared/data.js"></script>
<script>
function doLogin() {
  const user = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  if (user && pass) {
    Store.set('user', { name: 'Dr. A. Patel', username: user, role: 'doctor' });
    window.location.href = 'patients.html';
  } else {
    showEl('login-error');
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
