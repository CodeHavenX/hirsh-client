name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run verifyCi
        run: ./gradlew verifyCi --stacktrace

  package-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Built on a Windows runner (not the Linux dev machine) so jpackage bundles a
      # Windows JRE via jlink and produces a real Windows installer, not a Linux one --
      # packageReleaseMsi packages for whichever OS runs the build.
      - name: Build Windows MSI installer
        run: ./gradlew :composeApp:packageReleaseMsi --stacktrace

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: hirsh-client-windows-installer
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Production wasmJs bundle (composeApp.js + .wasm + composeResources) with only
      # relative asset paths, so it works unmodified from a project-page subpath
      # (https://<org>.github.io/hirsh-client/) with no base-href rewriting needed.
      - name: Build wasmJs production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
