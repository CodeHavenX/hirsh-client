name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # syncScreenshots (see root build.gradle.kts) commits and pushes a Roborazzi screenshot
    # sync straight back to the PR branch when CI's own render drifts from what's committed.
    permissions:
      contents: write
    env:
      # Bootstraps the backend's first SYSTEM_ADMIN account (see hirsh's own README) and doubles
      # as what the client's e2e suite logs in with (HISS-611) -- safe to hardcode: this only
      # ever exists in this job's own throwaway Postgres container, destroyed when it ends.
      HIRSH_ADMIN_USERNAME: admin
      HIRSH_ADMIN_PASSWORD: ci-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default pull_request checkout is a detached synthetic merge commit -- syncScreenshots
          # needs the PR's actual branch tip checked out so its commit (and push back to
          # $GITHUB_HEAD_REF) lands as a clean fast-forward on the real branch, not on a merge
          # commit's own throwaway history.
          ref: ${{ github.head_ref }}

      # The backend (hirsh) needs JDK 17 per its own README; the client needs 21. Two separate
      # setup-java calls each overwrite JAVA_HOME globally for later steps, so this one's value is
      # saved under its own name and referenced explicitly (JAVA_HOME=$JDK_17) only on the backend
      # steps below -- the second, client-facing "Set up JDK 21" step further down is deliberately
      # left as the ambient default for every other (unqualified) ./gradlew call in this job.
      - name: Set up JDK 17 (backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Save JDK 17 path
        run: echo "JDK_17=$JAVA_HOME" >> "$GITHUB_ENV"

      # hirsh lives in a separate, private repo (EspinozaCarlos/hirsh) -- the default GITHUB_TOKEN
      # can't check that out, so this needs a PAT with read-only Contents access to it, stored as
      # this repo's own HIRSH_BACKEND_PAT secret.
      - name: Checkout hirsh (backend)
        uses: actions/checkout@v4
        with:
          repository: EspinozaCarlos/hirsh
          token: ${{ secrets.HIRSH_BACKEND_PAT }}
          path: hirsh

      # hirsh's own docker-compose.yml starts Postgres 15 with the `hirsh` schema pre-created
      # (docker/postgres-init/01-create-schema.sql) -- reusing it here instead of hand-rolling an
      # equivalent GitHub Actions `services:` Postgres block means this workflow never drifts from
      # how the backend itself documents running locally. --wait blocks on its own healthcheck.
      - name: Start Postgres
        working-directory: hirsh
        run: docker compose up -d --wait

      # Backgrounded: a GitHub Actions run: step's child processes outlive that step, so this
      # stays up for every later step in the job. Logged to a file (not inherited stdout) so a
      # later failure has something to inspect -- see "Upload backend log" below.
      - name: Start the backend
        working-directory: hirsh
        run: |
          JAVA_HOME="$JDK_17" nohup ./gradlew bootRun > ../hirsh-bootRun.log 2>&1 &

      # /actuator/health 401s when unauthenticated rather than 200ing (Spring Security sits in
      # front of it) -- matching .claude/skills/_shared/real-backend-check.md's own convention,
      # any HTTP response at all (not a connection failure) means the backend is actually up.
      - name: Wait for the backend to be reachable
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            if [ "$code" != "000" ]; then
              echo "Backend responded with HTTP $code after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend never became reachable within 240s" >&2
          cat hirsh-bootRun.log || true
          exit 1

      - name: Set up JDK 21 (client)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # DesktopE2ETest launches a real windowed Compose Desktop process -- ubuntu-latest has no
      # X server, which fails it with java.awt.HeadlessException ("No X11 DISPLAY variable was
      # set"). Xvfb provides a virtual one; xvfb-run wraps the actual test invocation below.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # WebE2ETest drives a real headless browser via Playwright, which needs OS-level packages
      # (libevent, libavif, libmanette, libwoff, ...) ubuntu-latest doesn't preinstall. Playwright
      # itself knows exactly which packages its bundled browser versions need per-OS -- rather
      # than hand-maintain that list here, invoke its own install-deps CLI. Needs root (that's
      # what it installs with, per its own --help text), so this deliberately runs the JVM
      # directly rather than through Gradle -- running all of Gradle as root would leave
      # root-owned files under ~/.gradle that break the later non-root `xvfb-run ./gradlew` step.
      - name: Install Playwright OS dependencies
        run: |
          CP=$(./gradlew :composeApp:printDesktopTestRuntimeClasspath -q)
          sudo java -cp "$CP" com.microsoft.playwright.CLI install-deps

      # WebE2ETest's WasmDevServerProcess only waits for the dev server's port to open (180s
      # budget) before handing off to WebBridgeDriver.connect(), whose own timeout is a hardcoded
      # 30s in the pinned cmp-bridge-driver:0.1.0.3 -- there's no public API to configure it on
      # that version. A cold first-ever Kotlin/Wasm compile + webpack bundle easily exceeds 30s on
      # a fresh CI runner, well before the dev server can actually serve anything past its open
      # port. Building the identical bundle here first means Gradle's normal up-to-date checking
      # makes WasmDevServerProcess's later internal `wasmJsBrowserDevelopmentRun` invocation
      # near-instant instead (confirmed locally: under 1s once this output is already current).
      - name: Pre-warm the wasmJs dev bundle
        run: ./gradlew :composeApp:wasmJsBrowserDevelopmentWebpack --stacktrace

      - name: Run verifyCi
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew verifyCi --stacktrace

      # The console log only prints exception type + location for a failing test, never its
      # message (e.g. which tag timed out) -- this job has never uploaded the actual test report,
      # so a failure here has been undebuggable without reproducing it locally. Runs unconditionally
      # so a failure upstream still leaves something to inspect.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktopTest-reports
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirsh-bootRun-log
          path: hirsh-bootRun.log
          if-no-files-found: warn
