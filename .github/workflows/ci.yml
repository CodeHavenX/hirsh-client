name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # DesktopE2ETest launches a real windowed Compose Desktop process -- ubuntu-latest has no
      # X server, which fails it with java.awt.HeadlessException ("No X11 DISPLAY variable was
      # set"). Xvfb provides a virtual one; xvfb-run wraps the actual test invocation below.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # WebE2ETest drives a real headless browser via Playwright, which needs OS-level packages
      # (libevent, libavif, libmanette, libwoff, ...) ubuntu-latest doesn't preinstall. Playwright
      # itself knows exactly which packages its bundled browser versions need per-OS -- rather
      # than hand-maintain that list here, invoke its own install-deps CLI. Needs root (that's
      # what it installs with, per its own --help text), so this deliberately runs the JVM
      # directly rather than through Gradle -- running all of Gradle as root would leave
      # root-owned files under ~/.gradle that break the later non-root `xvfb-run ./gradlew` step.
      - name: Install Playwright OS dependencies
        run: |
          CP=$(./gradlew :composeApp:printDesktopTestRuntimeClasspath -q)
          sudo java -cp "$CP" com.microsoft.playwright.CLI install-deps

      # WebE2ETest's WasmDevServerProcess only waits for the dev server's port to open (180s
      # budget) before handing off to WebBridgeDriver.connect(), whose own timeout is a hardcoded
      # 30s in the pinned cmp-bridge-driver:0.1.0.3 -- there's no public API to configure it on
      # that version. A cold first-ever Kotlin/Wasm compile + webpack bundle easily exceeds 30s on
      # a fresh CI runner, well before the dev server can actually serve anything past its open
      # port. Building the identical bundle here first means Gradle's normal up-to-date checking
      # makes WasmDevServerProcess's later internal `wasmJsBrowserDevelopmentRun` invocation
      # near-instant instead (confirmed locally: under 1s once this output is already current).
      - name: Pre-warm the wasmJs dev bundle
        run: ./gradlew :composeApp:wasmJsBrowserDevelopmentWebpack --stacktrace

      - name: Run verifyCi
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew verifyCi --stacktrace

      # The console log only prints exception type + location for a failing test, never its
      # message (e.g. which tag timed out) -- this job has never uploaded the actual test report,
      # so a failure here has been undebuggable without reproducing it locally. Runs unconditionally
      # so a failure upstream still leaves something to inspect.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktopTest-reports
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn

  package-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Built on a Windows runner (not the Linux dev machine) so jpackage bundles a
      # Windows JRE via jlink and produces a real Windows installer, not a Linux one --
      # packageReleaseMsi packages for whichever OS runs the build.
      - name: Build Windows MSI installer
        run: ./gradlew :composeApp:packageReleaseMsi --stacktrace

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: hirsh-client-windows-installer
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Production wasmJs bundle (composeApp.js + .wasm + composeResources) with only
      # relative asset paths, so it works unmodified from a project-page subpath
      # (https://<org>.github.io/hirsh-client/) with no base-href rewriting needed.
      - name: Build wasmJs production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
